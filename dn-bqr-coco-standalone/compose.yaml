services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-pytorch/pytorch:2.1.2-cuda12.1-cudnn8-devel}
        TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-8.9}
    image: dn-bqr-coco:latest
    init: true
    shm_size: 32gb
    environment:
      TORCH_HOME: /workspace/torch-cache
      COCO_ROOT: /workspace/data/coco
      OUTPUT_ROOT: /workspace/artifacts
      NPROC_PER_NODE: ${NPROC_PER_NODE:-2}
      RUN_NAME: ${RUN_NAME:-poc_10k_20e}
      EPOCHS: ${EPOCHS:-20}
      STOP_AFTER_EPOCH: ${STOP_AFTER_EPOCH:-10}
      EVAL_EPOCHS: ${EVAL_EPOCHS:-5,10,15,20}
      BATCH_SIZE: ${BATCH_SIZE:-2}
      ACCUMULATION_STEPS: ${ACCUMULATION_STEPS:-4}
      EVAL_BATCH_SIZE: ${EVAL_BATCH_SIZE:-2}
      NUM_WORKERS: ${NUM_WORKERS:-8}
      PRECISION: ${PRECISION:-fp16}
      TRAIN_SIZE: ${TRAIN_SIZE:-10000}
      SUBSET_SEED: ${SUBSET_SEED:-42}
      SEED: ${SEED:-42}
      TARGET_GLOBAL_BATCH_SIZE: ${TARGET_GLOBAL_BATCH_SIZE:-16}
      DIAGNOSTICS_EVERY: ${DIAGNOSTICS_EVERY:-100}
      RESUME: ${RESUME:-auto}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU0_ID:-0}", "${GPU1_ID:-1}"]
              capabilities: [gpu]
    volumes:
      - ${COCO_ROOT:?Set COCO_ROOT to the COCO directory}:/workspace/data/coco:ro
      - ${OUTPUT_ROOT:-./artifacts}:/workspace/artifacts
      - ${TORCH_CACHE:-./torch-cache}:/workspace/torch-cache
    command:
      - torchrun
      - --standalone
      - --nproc_per_node=${NPROC_PER_NODE:-2}
      - train.py
      - --method
      - ${METHOD:-bqr}
      - --data-root
      - /workspace/data/coco
      - --output-root
      - /workspace/artifacts
      - --torch-cache
      - /workspace/torch-cache
      - --run-name
      - ${RUN_NAME:-poc_10k_20e}
      - --epochs
      - ${EPOCHS:-20}
      - --stop-after-epoch
      - ${STOP_AFTER_EPOCH:-10}
      - --eval-epochs
      - ${EVAL_EPOCHS:-5,10,15,20}
      - --batch-size
      - ${BATCH_SIZE:-2}
      - --accumulation-steps
      - ${ACCUMULATION_STEPS:-4}
      - --target-global-batch-size
      - ${TARGET_GLOBAL_BATCH_SIZE:-16}
      - --eval-batch-size
      - ${EVAL_BATCH_SIZE:-2}
      - --num-workers
      - ${NUM_WORKERS:-8}
      - --persistent-workers
      - --precision
      - ${PRECISION:-fp16}
      - --train-size
      - ${TRAIN_SIZE:-10000}
      - --subset-seed
      - ${SUBSET_SEED:-42}
      - --diagnostics-every
      - ${DIAGNOSTICS_EVERY:-100}
      - --seed
      - ${SEED:-42}
      - --resume
      - ${RESUME:-auto}

  smoke:
    profiles: ["smoke"]
    image: dn-bqr-coco:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-pytorch/pytorch:2.1.2-cuda12.1-cudnn8-devel}
        TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-8.9}
    init: true
    shm_size: 32gb
    environment:
      TORCH_HOME: /workspace/torch-cache
      COCO_ROOT: /workspace/data/coco
      OUTPUT_ROOT: /workspace/artifacts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU0_ID:-0}", "${GPU1_ID:-1}"]
              capabilities: [gpu]
    volumes:
      - ${COCO_ROOT:?Set COCO_ROOT to the COCO directory}:/workspace/data/coco:ro
      - ${OUTPUT_ROOT:-./artifacts}:/workspace/artifacts
      - ${TORCH_CACHE:-./torch-cache}:/workspace/torch-cache
    command: ["bash", "scripts/smoke_2gpu.sh"]

  evaluate:
    profiles: ["evaluation"]
    image: dn-bqr-coco:latest
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    shm_size: 32gb
    environment:
      TORCH_HOME: /workspace/torch-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU0_ID:-0}", "${GPU1_ID:-1}"]
              capabilities: [gpu]
    volumes:
      - ${COCO_ROOT:?Set COCO_ROOT to the COCO directory}:/workspace/data/coco:ro
      - ${OUTPUT_ROOT:-./artifacts}:/workspace/artifacts
      - ${TORCH_CACHE:-./torch-cache}:/workspace/torch-cache
    command:
      - torchrun
      - --standalone
      - --nproc_per_node=${NPROC_PER_NODE:-2}
      - evaluate.py
      - ${CHECKPOINT:-/workspace/artifacts/checkpoint.pt}
      - --data-root
      - /workspace/data/coco
      - --output-root
      - /workspace/artifacts
      - --torch-cache
      - /workspace/torch-cache
      - --batch-size
      - ${EVAL_BATCH_SIZE:-2}
      - --num-workers
      - ${NUM_WORKERS:-8}
