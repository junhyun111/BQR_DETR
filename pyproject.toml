[project]
name = "gt-guided-dino-voc"
version = "0.1.0"
description = "Official DINO R50 with a training-only GT-guided auxiliary localization path"
requires-python = ">=3.14,<3.15"
dependencies = [
  "addict>=2.4,<3",
  "ipykernel>=7,<8",
  "jupyterlab>=4,<5",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "pycocotools>=2.0.10,<3",
  "scipy>=1.15,<2",
  "termcolor>=3,<4",
  "timm>=1.0.20,<2",
  "torch>=2.12,<2.13",
  "torchvision>=0.27,<0.28",
  "tqdm>=4.67,<5",
  "yapf>=0.43,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
